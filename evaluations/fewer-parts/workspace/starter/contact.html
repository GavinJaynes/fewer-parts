<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Acme Library</title>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="min-h-dvh bg-paper-50 text-ink-950">
  <header class="border-b border-paper-100 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <a href="index.html" class="text-lg font-semibold">Acme Library</a>
      <nav aria-label="Primary" class="flex gap-4 text-sm">
        <a href="index.html" class="underline-offset-4 hover:underline">Home</a>
        <a href="contact.html" class="underline-offset-4 hover:underline" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-xl px-6 py-8">
    <h1 class="text-2xl font-semibold">Message the librarians</h1>
    <p class="mt-2 text-ink-700">We usually reply within one working day.</p>

    <form id="contact-form" class="mt-6 space-y-5" novalidate>
      <div>
        <label for="name" class="block font-medium">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" required
          class="mt-1 block w-full rounded border border-ink-500/40 bg-white px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600"
          aria-describedby="name-error">
        <p id="name-error" class="mt-1 hidden text-sm text-danger-600"></p>
      </div>

      <div>
        <label for="email" class="block font-medium">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required
          class="mt-1 block w-full rounded border border-ink-500/40 bg-white px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600"
          aria-describedby="email-error">
        <p id="email-error" class="mt-1 hidden text-sm text-danger-600"></p>
      </div>

      <div>
        <label for="message" class="block font-medium">Message</label>
        <textarea id="message" name="message" rows="4" required
          class="mt-1 block max-h-72 min-h-24 w-full resize-y overflow-auto rounded border border-ink-500/40 bg-white px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600"
          aria-describedby="message-hint message-error"></textarea>
        <p id="message-hint" class="mt-1 text-sm text-ink-500">Tell us which resource you need and when.</p>
        <p id="message-error" class="mt-1 hidden text-sm text-danger-600"></p>
      </div>

      <button type="submit"
        class="rounded bg-accent-600 px-4 py-2 font-medium text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-600">
        Send message
      </button>
      <p id="form-status" role="status" aria-live="polite" class="text-sm text-ink-700"></p>
    </form>
  </main>

  <script type="module" src="src/contact-form.js"></script>
</body>
</html>
